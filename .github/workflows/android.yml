name: Android E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *' # nightly smoke: catches drift in the emulator image, Chrome or the app release
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    name: E2E (Android emulator, API ${{ matrix.api-level }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [34]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Also installs the uiautomator2 driver: it is a devDependency, pinned in the lockfile.
      - run: npm ci

      - name: Download app under test
        run: npm run app:android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # CI runs @smoke only, on every trigger; @regression runs locally (npm run test:android / test:android-web).
          TAG: '@smoke'
          TIMEOUT_FACTOR: 2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes each script line on its own: keep the logcat dump on the same line as the tests.
          script: npm run test:android || (adb logcat -d > logs/logcat.txt; adb logcat -d -b crash > logs/logcat-crash.txt; exit 1)

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            reports/
            logs/
          retention-days: 14

  e2e-web:
    name: E2E (Android Chrome)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Also installs the uiautomator2 driver; chromedriver is fetched at session start to match the AVD's Chrome.
      - run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Same key as the native job: both suites boot the same API 34 google_apis image (it ships Chrome).
      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created"

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # CI runs @smoke only, on every trigger; @regression runs locally (npm run test:android / test:android-web).
          TAG: '@smoke'
          TIMEOUT_FACTOR: 2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The runner executes each script line on its own: keep the logcat dump on the same line as the tests.
          script: npm run test:android-web || (adb logcat -d > logs/logcat.txt; adb logcat -d -b crash > logs/logcat-crash.txt; exit 1)

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-web-reports
          path: |
            reports/
            logs/
          retention-days: 14

  report:
    name: Allure report
    needs: [e2e, e2e-web]
    # Published from main only (push + nightly); PRs keep each job's artifacts. Runs even when tests failed:
    # that is when the report matters most.
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # A job that died before running tests has no results: skip it instead of failing the report.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-reports
          path: artifacts/native
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-web-reports
          path: artifacts/web

      - name: Generate one report for both suites
        run: |
          dirs=$(ls -d artifacts/*/reports/allure-results 2>/dev/null || true)
          if [ -z "$dirs" ]; then echo "No Allure results to report"; exit 1; fi
          npx allure generate $dirs -o allure-report --name "My Demo App (native) + SauceDemo (mobile web)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deploy
        uses: actions/deploy-pages@v4
